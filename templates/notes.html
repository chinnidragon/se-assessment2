<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}">
    <title>note note note sahur</title>
</head>
<body>
    <h1>
        notetaker heaven over here :heart emoji:
    </h1>


    <form id="form" >
        <fieldset>
            <legend>Take notes here</legend>
            <textarea name="note_body" id="note_body" placeholder="Add your notes here!"></textarea>
        </fieldset>

        <input type="submit" class="btn" value="Submit session notes for today">
    </form>

    <h2>
        Previous notes
    </h2>
    <div class="previous_notes" id="previous-notes" style="display: flex; flex-direction: column;">
        
    </div>

    <script>
        async function getnotes() {
            try {
                // retrieving the saved notes
                const response = await fetch("/api/getnotes", {method: "GET", credentials: 'same-origin'});
                const data = await response.json();
                // defining the container for these saved notes (the empty div with the previous-notes ID)

                if (data.status === 'success') {
                    const container = document.getElementById('previous-notes');
                    container.innerHTML = '';
                    // for loop that iterates through all the note entries 
                    for (const note of data.notes) {
                        // previous note div
                        const previousnote = document.createElement('div');
                        previousnote.className = "card"
                        // creating the date and body of the note
                        const h = document.createElement('h3'); h.textContent = note.date;
                        const p = document.createElement('p'); p.textContent = note.notes;
                        previousnote.appendChild(h);
                        previousnote.appendChild(p);
                        container.appendChild(previousnote);
                }
            } else {
                if (data.message === "unauthenticated") {
                    alert("Sign in to see/save your previous notes")
                    window.location.href = ('{{ url_for("login")}}')
                } else {
                    alert("Error, try again later");
                }
                
        }
            } catch (error) {
                console.error(error);
                alert("Error, try again later");
            }
        }

        getnotes()

        const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const response = await fetch("/api/sessionID", {method: "GET", credentials: 'same-origin'});
                sessionID = await response.json();
                if (!sessionID.active) {
                    alert("Sign in first");
                    window.location.href = ('{{ url_for("login")}}')
                }
                // Preventing the default event (here it stops the browser's default behaviour)
                
                // loading all information into a dictionary to send to the backend
                const notes = {}
                const now = new Date();
                body = document.getElementById('note_body').value;
                notes['body'] = body
                // readable human format
                notes['date'] = now.toDateString()

                try {
                    const response = await fetch("/api/savenotes", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        //mitigating CSRF - ONLY accepts it from 127.0.0.1:5000
                        credentials: 'same-origin',
                        body: JSON.stringify(notes)
                });
                result = await response.json()
                    if (result.status === 'success') {
                        alert("Notes successfully saved!")
                        window.location.href = "{{ url_for('home') }}";
                    } else {
                        alert(`Error, ${result.error}`)
                    }
            } catch (error) {
                alert("Error, try again later");
        }
            });
    } else {
        console.error("wheres the form vro")
    }
    </script>
</body>
</html>
