<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first time here?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}">
</head>
<body class="login">
     <div class = "navbar">
        <div>
            <a href="{{ url_for('index')}}">
                <div class="logosmall">
                    <img src="{{ url_for('static', filename='images/logosmall.png')}}" width="50" height="50"> 
                </div>
            </a>
        </div>

        <div class="navtext">
            {% if session.get('user_id') %}
                <a href="{{ url_for('profile')}}">
                    <div class="navlinks">
                        <img src="{{ url_for('static', filename='images/nav/profile.png')}}" width="30" height="30"> 
                        Your profile
                    </div>
                </a>

                <a href="{{ url_for('notes')}}">
                    <div class="navlinks">
                        <img src="{{ url_for('static', filename='images/nav/note.png')}}" width="30" height="30"> 
                        Notes
                    </div>
                </a>
            {% else %}
            {% endif %}
            <a href="{{ url_for('notices')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/bell.png')}}" width="30" height="30"> 
                    Notices
                </div>
            </a>

            <a href="{{ url_for('view_chars')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/char.png')}}" width="30" height="30"> 
                    Characters
                </div>
            </a>

            <a href="{{ url_for('dice')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/dice.png')}}" width="30" height="30"> 
                    Dice
                </div>
            </a>

            <a href="{{ url_for('timetable')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/time.png')}}" width="30" height="30"> 
                    Timetable
                </div>
            </a>
        </div>
        <div style="align-self: flex-end;">
            {% if session.get('user_id') %}
            <div class="navlinks">
                <a href="{{ url_for('logout')}}">Log out</a>
            </div>

            {% else %}
            <div class="navlinks">
                <a href="{{ url_for('login')}}">Log in</a>
            </div>

            {% endif %}
        </div>
    </div>
    <div class="login">
    <img src="{{ url_for('static', filename='images/millionsslices.png')}}">
        <div style="flex-direction: column; align-self: center;">
            <h2>
                Sign up
            </h2>
            <form id="form" class="form">
                <div class="content">
                    <div class="card" style="width: 50vw; height: 10vw; align-items: left; min-width: 300px; min-height: 150px;">
                        <div style="display: flex; flex-direction: column; max-width: fit-content;">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div style="display: flex; flex-direction: column; max-width: fit-content;" >
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </div>
                    <div>
                        <input class="btn" type="submit" value="Let's Go!!">
                    </div>
                </div>
            </form>
            <h3>
                <a href="{{ url_for('login') }}">Already a member? Login!</a>
            </h3>
        </div>

    </div>

    
    <script>
        const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
            // Preventing the default event (here it stops the browser's default behaviour)
            e.preventDefault();
            const profile = {}
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            profile["email"] = email
            profile["password"] = password
            //debug
            console.log(profile)
            try {
                const response = await fetch("/api/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(profile)
                });
                if (!response.ok) {
                    throw new Error("oops... try again...");
                }
                else {
                    alert("Account created! Welcome to DND!");
                    window.location.href = "{{ url_for('login') }}"
                };
                } catch (error) {
                    // console.error("Error saving membership", error);
                    alert("Failed to create account... try again maybe?");
                    }
            });
        } else {
            console.error("wheres the form vro")
        }
    </script>

</body>
</html>
