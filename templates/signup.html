<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first time here?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}">
</head>

<body>
    <form id="form" class="form" action="{{ url_for('home') }}" method="post">
        <div style="display:flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; flex-direction: column; max-width: fit-content;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div style="display: flex; flex-direction: column; max-width: fit-content;" >
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
        </div>
        <div>
            <input class="btn" type="submit" value="Let's Go!!">
            <!-- <button id="submitbutton" type="submit" value="Let's Go!!"></button> -->
        </div>
    </form>
    <h3>
        <a href="{{ url_for('login') }}">Already a member? Login!</a>
    </h3>
    
    <script>
        const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
            // Preventing the default event (here it stops the browser's default behaviour)
            e.preventDefault();
            const profile = {}
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            profile["email"] = email
            profile["password"] = password
            //debug
            console.log(profile)
            try {
                const response = await fetch("/api/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(profile)
                });
                if (!response.ok) {
                    throw new Error("oops... try again...");
                }
                else {
                    alert("Account created! Welcome to DND!");
                    window.location.href = "{{ url_for('home') }}"
                };
                } catch (error) {
                    // console.error("Error saving membership", error);
                    alert("Failed to create account... try again maybe?");
                    }
            });
        } else {
            console.error("wheres the form vro")
        }
    </script>

</body>
</html>
