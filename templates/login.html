<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}">
</head>

<body>
    <div class="login">
        <h2>
            Login
        </h2>
        <form class="form" action="{{ url_for('homepage') }}" method="post">
            <div style="display:flex; flex-direction: column; gap: 10px;">
                <div style="display: flex; flex-direction: column; max-width: fit-content;">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="password" required>
                </div>
                <div style="display: flex; flex-direction: column; max-width: fit-content;" >
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </div>
            <div>
                <input class="btn" type="submit" value="Let's Go!!">
                <!-- <button id="submitbutton" type="submit" value="Let's Go!!"></button> -->
            </div>
        </form>
        <h3>
            <a href="signup.html">Request membership</a>
        </h3>
    </div>
    <img src="{{ url_for('static', filename='images/millionsslices.png')}}">


</body>
</html>
