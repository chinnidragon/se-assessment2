<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fancy seeing you again!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}">
</head>

<body>
    <div class="login">
        <div class="loginform">
            <h2>
                Login
            </h2>
            <div class="content">
                <form class="form" id="form">
                    <div class="card">
                        <div style="display: flex; flex-direction: column; max-width: fit-content;">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div style="display: flex; flex-direction: column; max-width: fit-content;" >
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </div>
                    <div>
                        <input class="btn" type="submit" value="Let's Go!!">
                    </div>
                </form>
                <h3>
                    <a href="{{ url_for('signup') }}">Request membership</a>
                </h3>
            </div>
        </div>
        <img src="{{ url_for('static', filename='images/millionsslices.png')}}" width="500px">
    </div>


    <script>
        const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
            // Preventing the default event (here it stops the browser's default behaviour)
                e.preventDefault();
                const profile = {}
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                profile['email'] = email
                profile['password'] = password
                //debug
                // console.log(profile)
                try {
                    const response = await fetch("/api/login", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: 'same-origin',
                        body: JSON.stringify(profile)
                    });
                    const result = await response.json();
                    if (result['status'] == 'success') {
                        window.location.href = "{{ url_for('home') }}"
                        // debug
                        // console.log('Hello, World!')
                    } else {
                            alert('Incorrect email/password. Maybe check your spelling lol')
                }
                    } catch (error) {
                        // console.error("Error saving membership", error);
                        alert("Error, try again later");
                    }
            });
    } else {
        console.error("wheres the form vro")
    }
    </script>
</body>
</html>
