<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}"/>
    <title>reinvent urself</title>
</head>
<body>
    <form class="form" id="form">
        <div class="card">
            <div style="display: flex; flex-direction: column; max-width: fit-content;">
                <label for="display-name">Display name</label>
                <input type="text" id="display-name" name="display-name">
            </div>
            <div style="display: flex; flex-direction: column; max-width: fit-content;" >
                <label for="password">Bio (cannot be more than 150 characters)</label>
                <input type="text" id="bio" name="bio">
            </div>
        </div>
        <div>
            <input class="btn" type="submit" value="Let's Go!!">
        </div>
    </form>
    <script>
const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
            // Preventing the default event (here it stops the browser's default behaviour)
                e.preventDefault();
                const profile = {}
                const displayName = document.getElementById('display-name').value;
                const bio = document.getElementById('bio').value;
                profile['display_name'] = displayName
                profile['bio'] = bio
                //debug
                // console.log(profile)
                try {
                    const response = await fetch("/api/saveprofile", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        credentials: 'same-origin',
                        body: JSON.stringify(profile)
                    });
                    const result = await response.json();
                    if (result['status'] == 'success') {
                        alert('Profile saved!')
                        window.location.href = ('{{ url_for("profile") }}')
                    } else {
                        alert(`Error, ${result.error}`)
                }
                    } catch (error) {
                        // console.error("Error saving membership", error);
                        alert("Error, try again later");
                    }
            });
    } else {
        console.error("wheres the form vro")
    }
    </script>
</body>
</html>
