<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css')}}" />
</head>
<body>
    <div class = "navbar">
        <div>
            <a href="{{ url_for('index')}}">
                <div class="logosmall">
                    <img src="{{ url_for('static', filename='images/logosmall.png')}}" width="50" height="50"> 
                </div>
            </a>
        </div>

        <div class="navtext">
            {% if session.get('user_id') %}
                <a href="{{ url_for('profile')}}">
                    <div class="navlinks">
                        <img src="{{ url_for('static', filename='images/nav/profile.png')}}" width="30" height="30"> 
                        Your profile
                    </div>
                </a>

                <a href="{{ url_for('notes')}}">
                    <div class="navlinks">
                        <img src="{{ url_for('static', filename='images/nav/note.png')}}" width="30" height="30"> 
                        Notes
                    </div>
                </a>
            {% else %}
            {% endif %}
            <a href="{{ url_for('notices')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/bell.png')}}" width="30" height="30"> 
                    Notices
                </div>
            </a>

            <a href="{{ url_for('view_chars')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/char.png')}}" width="30" height="30"> 
                    Characters
                </div>
            </a>

            <a href="{{ url_for('dice')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/dice.png')}}" width="30" height="30"> 
                    Dice
                </div>
            </a>

            <a href="{{ url_for('timetable')}}">
                <div class="navlinks">
                    <img src="{{ url_for('static', filename='images/nav/time.png')}}" width="30" height="30"> 
                    Timetable
                </div>
            </a>
        </div>
        <div style="align-self: flex-end;">
            {% if session.get('user_id') %}
            <div class="navlinks">
                <a href="{{ url_for('logout')}}">Log out</a>
            </div>

            {% else %}
            <div class="navlinks">
                <a href="{{ url_for('login')}}">Log in</a>
            </div>

            {% endif %}
        </div>
    </div>
    <h1>
        Dice Rolling!
    </h1>

    <div class="genericflex">


        <form id="form">
            <fieldset>
                <legend>Choose a die</legend>
                <div class="dicebar">
                    <div>
                        <img src="{{ url_for('static', filename='images/dice/20.png')}}" width="70px">
                        <div>
                            <input id="dice20" name="dice" type="radio" value="20">
                            <label for="dice20">d20</label>
                        </div>
                    </div>

                    <div>
                        <img src="{{ url_for('static', filename='images/dice/12.png')}}" width="70px">
                        <div>
                            <input id="dice12" name="dice" type="radio" value="12">
                            <label for="dice12">d12</label>
                        </div>
                    </div>

                    <div>
                        <img src="{{ url_for('static', filename='images/dice/10.png')}}" width="70px">
                        <div>
                            <input id="dice10" name="dice" type="radio" value="10">
                            <label for="dice10">d10</label>
                        </div>
                    </div>
                        
                    <div>
                        <img src="{{ url_for('static', filename='images/dice/8.png')}}" width="70px">
                        <div>
                            <input id="dice8" name="dice" type="radio" value="8">
                            <label for="dice8">d8</label>
                        </div>
                    </div>

                    <div>
                        <img src="{{ url_for('static', filename='images/dice/6.png')}}" width="70px">
                        <div>
                            <input id="dice6" name="dice" type="radio" value="6">
                            <label for="dice6">d6</label>
                        </div>
                    </div>

                    <div>
                        <img src="{{ url_for('static', filename='images/dice/4.png')}}" width="70px">
                        <div>
                            <input id="dice4" name="dice" type="radio" value="4">
                            <label for="dice4">d4</label>
                        </div>
                    </div>
                </div>
            </fieldset>
            <input class="btn" id="dicesubmit" type="submit" value="Roll with this dice!">
        </form>

    </div>


    <script>
        const form = document.getElementById('form');
        if (form) {
            form.addEventListener('submit', async (e) => {
            // Preventing the default event (here it stops the browser's default behaviour)
                e.preventDefault();
                // Getting the dice that was picked in the form (e.g 20d, 8d, 6d)
                const dicesides = document.querySelector('input[name="dice"]:checked').value;
                // Dice must be selected
                if (!dicesides) {
                    alert('Please select a die first');
                    return;
                }
            const dice = {}
            //max value that the dice can roll (same as the number of sides on the dice)
            // alert(dice)
            dice["max-value"] = dicesides

            // debug
                //could probably also add biases here if i had time sighhh maybe maybe not Okay does anyone even need bias calculators anyway colton ang should die Okayyy like lowkey it doesnt matter and he can just calculate it anyway right...
            try {
                //removing the OLD dice roll result ONLY if there is one
                const old = document.getElementById('diceDiv');
                if (old) old.remove();
                
                //calling the dice roll API
                const response = await fetch("/api/dice", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(dice)
                });

                //if there was no response from the dice roll API
                if (!response.ok) {
                    alert('Sorry, there was an error! Try again?');
                }

                const data = await response.json();
                const rolledValue = data.number;
                
                //dynamically creating new elements to display the user's dice roll
                    //the value of the roll and a new button to reroll
                const diceDiv = document.createElement('div');
                diceDiv.id = 'diceDiv'
                //can add styling and stuff like later.....

                const diceValueTitle = document.createElement('h3');
                diceValueTitle.textContent = `With the ${dicesides} side dice:`

                const diceValue = document.createElement('p');
                diceValue.textContent = `You rolled a ${rolledValue}!`
                // diceValue.className = 'h2';
                // add styling later...

                const roller = document.createElement('button')
                roller.className = 'btn';
                roller.textContent = 'Roll Again!';
                // add styling later...
                roller.addEventListener('click', async () => {
                    try {
                        //calling the dice roll api again (when the roll button is clicked)
                        const response = await fetch("/api/dice", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify(dice)
                    });
                        if (response.ok) { //adding the NEW rolled value to the page
                            const newData = await response.json();
                            const rolledValue = newData.number;
                            diceValue.textContent = `You rolled a ${rolledValue}!`
                        }
                    } catch (err) { //having the same error messages to increase security (malicious parties cannot glean information from the error message)
                        alert("Error: something went wrong! Try again?")
                    }
                });
            
            // attaching the newly created elements (Dice value, roll button)
            // as a child to the all-encompassing Dice Div
            // which is in turn attached to the DOM (so that it becomes visible)
            diceDiv.appendChild(diceValueTitle);
            diceDiv.appendChild(diceValue);
            diceDiv.appendChild(roller);
            document.body.appendChild(diceDiv);
            form.reset();
            
            } catch (error) {
                alert("Sorry, there was an error! Try again?");
            }
        });
    } else { //if the form wasnt found?? lol
        console.error("wheres the form vro...");
    }
    </script>
</body>
</html>
